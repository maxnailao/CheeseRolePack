plugins {
    id 'fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            programArgs "--username", "debug_player", "--uuid", "8667ba71-b85a-4004-af54-45d406651831"
        }
    }
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ———— StarRailExpress 依赖 ————
    // 发行版 jar 与 dev jar 里的 mixin 注解映射不同 ——
    //   发行版（build/libs，intermediary）：@Inject 目标是 method_5652 这类 intermediary 名，
    //        且**不带 refmap**（现代 Loom 直接把注解字符串改写掉）。直接拿它在 dev 环境跑，
    //        SRE 自己的 mixin 会对不上具名方法而抛 InvalidInjectionException。
    //   dev 版（build/devlibs，具名）：@Inject 目标是 addAdditionalSaveData 这类具名方法，
    //        正好匹配 dev 环境 —— 这就是 Ricord（SRE 源码工程）能在 dev 跑的原因。
    // 结论：**编译**依赖发行版（保证 API 与线上一致），**dev 运行**（runClient）用同源的 dev jar。
    // 两者不能同时进入运行时类路径（同一 mod id 会重复加载），所以发行版只做 modCompileOnly。
    modCompileOnly files("libs/star_rail_express-4.3.0.jar")
    runtimeOnly files("libs/star_rail_express-4.3.0-dev.jar")
    // 资源库模组（mod id = sre_resource，文件名是 sre-lib-1.0.3.jar）
    modImplementation files("libs/sre-lib-${project.sre_lib_version}.jar")
    // Wathe 空壳 jar：SRE 的 ShopEntry 继承自 dev.doctor4t.wathe.util.ShopEntry，
    // 编译商店条目时必须能从类路径上找到它。
    modImplementation files("libs/wathe-1.3.2.jar")

    // Cardinal Components API：SRE 的组件 KEY 类型来自 CCA，编译与运行都需要。
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}"

    // ———— 运行期（仅 runClient 需要，全部按需放到 runtime_mods/） ————
    // 平时构建不会用到这个目录，留空即可；想跑 runClient 时，把你游戏 mods 目录里的
    // 模组（StarRailExpress 的整套前置：真实的 wathe、cloth-config、modmenu、
    // simple-voice-chat、architectury、exposure、ratatouille、veil、midnightlib、
    // ForgeConfigAPIPort、datasync …）拷进 runtime_mods/ 即可，不会被 git/构建污染。
    modRuntimeOnly fileTree(dir: 'runtime_mods', include: '*.jar')

    // ———— 故意不引入的依赖（都有原因，勿随意加回） ————
    // blindness（失明症）：只服务于特定角色，且硬依赖 kirin + owo-lib + player-animator；
    //                      StarRailExpress 本身不依赖它，本附加模组也不需要。
    // presencefootsteps  ：硬依赖 kirin。
    // sodium / iris      ：StarRailExpress 4.3.0 的 fabric.mod.json 里有
    //                      breaks `sodium < 0.8.2`，引入会让 SRE 拒绝加载。
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}
